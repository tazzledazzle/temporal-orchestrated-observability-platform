            - generic [ref=f3e164]:
              - time [ref=f3e165]: Sep 14
              - link [ref=f3e166] [cursor=pointer]:
                - /url: https://grafana.com/blog/digital-experience-monitoring-with-grafana-cloud-session-replay-synthetic-checks-and-faster-investigations/
                - 'heading "Digital Experience Monitoring with Grafana Cloud: Session Replay, synthetic checks, and faster investigations" [level=3] [ref=f3e167]'
              - generic [ref=f3e168]: "When something breaks in production, the questions that matter most are also the toughest to answer from metrics alone: who was affected, what did they actually see, and is this worth waking someone up for? Answering those questions requires a fuller picture of the issue and its impact on your users."
          - article [ref=f3e169]:
            - link [aria-hidden] [ref=f3e170] [cursor=pointer]:
