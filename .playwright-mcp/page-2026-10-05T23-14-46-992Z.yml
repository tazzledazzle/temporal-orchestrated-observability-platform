            - generic [ref=f3e171]:
              - time [ref=f3e172]: Sep 10
              - link [ref=f3e173] [cursor=pointer]:
                - /url: https://grafana.com/blog/synthetic-monitoring-labels-update/
                - 'heading "Custom labels in Grafana Cloud Synthetic Monitoring: New updates for consistency and ease-of-use" [level=3] [ref=f3e174]'
              - generic [ref=f3e175]: "Labels are a powerful way to organize telemetry and define policies across Grafana Cloud, helping to streamline alerting, attribution, access control, and more. But traditionally, custom labels in Synthetic Monitoring have worked a little differently: they only lived on a single sm_check_info metric, and Grafana Cloud prefixed each one with label_."
          - article [ref=f3e176]:
            - link [aria-hidden] [ref=f3e177] [cursor=pointer]:
              - /url: https://grafana.com/blog/how-to-monitor-cypress-tests-with-grafana-cloud/
            - generic [ref=f3e178]:
              - time [ref=f3e179]: Sep 09
              - link [ref=f3e180] [cursor=pointer]:
                - /url: https://grafana.com/blog/how-to-monitor-cypress-tests-with-grafana-cloud/
                - heading "How to monitor Cypress tests with Grafana Cloud" [level=3] [ref=f3e181]
              - generic [ref=f3e182]: If your Cypress suite has tests that fail more often or run slower, you know it can be hard to figure out the pattern from a single job. It could be one spec that slowed down, or a single test that fails, or maybe the entire suite is trending slower. The root cause could be a bug in the app, or a flaky test, or something else. Your terminal output and CI log will tell you what happened on a single run, but that doesn't help you spot any larger trends—especially since you lose that data as soon as the job finishes.
          - article [ref=f3e183]:
            - link [aria-hidden] [ref=f3e184] [cursor=pointer]:
              - /url: https://grafana.com/blog/how-to-measure-and-improve-instrumentation-quality-for-better-full-stack-observability/
            - generic [ref=f3e185]:
              - time [ref=f3e186]: Aug 27
              - link [ref=f3e187] [cursor=pointer]:
                - /url: https://grafana.com/blog/how-to-measure-and-improve-instrumentation-quality-for-better-full-stack-observability/
                - heading "How to measure and improve instrumentation quality for better full-stack observability" [level=3] [ref=f3e188]
              - generic [ref=f3e189]: Modern engineering teams instrument everything, with metrics, logs, traces, and profiles flowing from hundreds of services at once. But full-stack observability isn’t really about collecting more telemetry; it's about having a single, unified picture of how your services connect to every layer beneath them, including their dependencies, the pods and nodes they run on, and the logs, traces, and profiles that explain their behavior.
          - article [ref=f3e190]:
            - link [aria-hidden] [ref=f3e191] [cursor=pointer]:
              - /url: https://grafana.com/blog/the-grafana-ai-sdk-for-go-a-shared-foundation-for-building-ai-applications/
            - generic [ref=f3e192]:
              - time [ref=f3e193]: Aug 25
              - link [ref=f3e194] [cursor=pointer]:
                - /url: https://grafana.com/blog/the-grafana-ai-sdk-for-go-a-shared-foundation-for-building-ai-applications/
                - 'heading "The Grafana AI SDK for Go: a shared foundation for building AI applications" [level=3] [ref=f3e195]'
              - generic [ref=f3e196]: "Starting an experiment with an LLM has never been easier. Keeping a growing collection of those experiments consistent is another matter.Earlier this year, as more teams began exploring AI features here at Grafana Labs, we repeatedly encountered the same pattern: a new experiment would start, move quickly, and build its own client for whichever model provider it needed. The next experiment would do the same, with a slightly different abstraction for streaming, tools, errors, or provider configuration."
          - article [ref=f3e197]:
            - link [aria-hidden] [ref=f3e198] [cursor=pointer]:
              - /url: https://grafana.com/blog/how-to-scale-alloy-as-a-central-telemetry-gateway-capacity-planning-load-testing-and-production-lessons/
            - generic [ref=f3e199]:
              - time [ref=f3e200]: Aug 21
              - link [ref=f3e201] [cursor=pointer]:
                - /url: https://grafana.com/blog/how-to-scale-alloy-as-a-central-telemetry-gateway-capacity-planning-load-testing-and-production-lessons/
                - 'heading "How to scale Alloy as a central telemetry gateway: capacity planning, load testing, and production lessons" [level=3] [ref=f3e202]'
              - generic [ref=f3e203]: Running Alloy as a single-instance sidecar is simple. Running it as a centralized gateway that absorbs the full telemetry stream of an enterprise platform—tens of millions of active series, terabytes of logs per day, and tens of thousands of trace spans per second—is a different challenge altogether. To get it right, you need deliberate capacity planning, honest load testing, and a monitoring setup that doesn't rely on the very thing you're testing.
          - article [ref=f3e204]:
            - link [aria-hidden] [ref=f3e205] [cursor=pointer]:
              - /url: https://grafana.com/blog/grafana-13-2-release-all-the-latest-features/
            - generic [ref=f3e206]:
              - time [ref=f3e207]: Aug 20
              - link [ref=f3e208] [cursor=pointer]:
                - /url: https://grafana.com/blog/grafana-13-2-release-all-the-latest-features/
                - 'heading "Grafana 13.2 release: easier ways to query and explore your data" [level=3] [ref=f3e209]'
              - generic [ref=f3e210]: Grafana 13.2 is here, bringing more improvements to help you and your team explore your data and get to insights faster.In this post, we’ll highlight the latest updates to saved queries, a feature that lets teams share, discover, and reuse queries to get to trusted answers faster and help new teammates get up to speed. We’ll also explore how the new View panel sidebar makes exploring busy panels a breeze.