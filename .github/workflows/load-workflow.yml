name: Load Test — Workflow Throughput

on:
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Load tier'
        required: false
        default: target
        type: choice
        options: [baseline, target, stress]

jobs:
  load-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Start platform
        uses: ./.github/actions/start-platform

      - name: Determine tier
        id: tier
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "value=baseline" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ github.event.inputs.tier || 'target' }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=target" >> "$GITHUB_OUTPUT"
          fi

      - name: Run WorkflowThroughputSimulation
        run: |
          ./gradlew \
            ":load-tests:gatlingRun-com.portfolio.temporalobs.loadtest.WorkflowThroughputSimulation" \
            -Ptier=${{ steps.tier.outputs.value }} \
            --no-daemon

      - name: Upload Gatling report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-load-report
          path: load-tests/build/reports/gatling/
          retention-days: 30
