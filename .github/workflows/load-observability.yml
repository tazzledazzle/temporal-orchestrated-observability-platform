name: Load Test — Observability Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  load-observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] \
            https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -q
          sudo apt-get install -y k6
          k6 version

      - name: Start platform
        uses: ./.github/actions/start-platform

      - name: Run ObservabilityPipelineSimulation
        run: |
          ./gradlew \
            ":load-tests:gatlingRun-com.portfolio.temporalobs.loadtest.ObservabilityPipelineSimulation" \
            --no-daemon

      - name: Run k6 observability HTTP stress
        run: ./gradlew :load-tests:k6ObservabilityLoad --no-daemon

      - name: Upload observability load report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-load-report
          path: |
            load-tests/build/reports/gatling/
            load-tests/build/reports/k6/summary.json
          retention-days: 30
